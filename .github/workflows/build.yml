name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mods:
    name: Validate mods/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mod manifest.json files
        run: |
          set -e
          shopt -s nullglob
          for manifest in mods/*/manifest.json; do
            echo "Validating $manifest"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$manifest"
          done

  build-engine:
    name: Build engine/ (CMake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel

  build-webapp:
    name: Build webapp/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile webapp
        run: python -m py_compile webapp/app.py

  build-scripts:
    name: Build scripts/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: |
          set -e
          find scripts -name '*.py' -not -path '*/__pycache__/*' -print0 | xargs -0 -n1 python -m py_compile
      - name: Run distro build script
        run: python scripts/build_distro.py
      - name: Upload distro archive
        uses: actions/upload-artifact@v4
        with:
          name: networkbuster-distro
          path: dist/*.zip
